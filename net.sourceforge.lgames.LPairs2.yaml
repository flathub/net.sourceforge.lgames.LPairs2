app-id: net.sourceforge.lgames.LPairs2
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: lpairs2
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  # LPairs2 does not respect XDG (uses ~/.lpairs2.conf file)
  - --persist=.
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/aclocal
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - shared-modules/glu/glu-9.json
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/SDL2/SDL2_ttf.json
  - name: lpairs2
    buildsystem: autotools
    post-install:
      - install -Dm644 lpairs2.png /app/share/icons/hicolor/256x256/apps/net.sourceforge.lgames.LPairs2.png
      - install -Dm644 net.sourceforge.lgames.LPairs2.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 net.sourceforge.lgames.LPairs2.desktop -t /app/share/applications/
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/lgames/lpairs/lpairs2-2.3.2.tar.gz
        sha256: cb87912d685f2385cc06d182a9d33f97af697ed18621b563544933fefe72b592
        x-checker-data:
          type: anitya
          # project-id obtained from https://release-monitoring.org/
          project-id: 8580
          stable-only: true
          url-template: https://downloads.sourceforge.net/project/lgames/lpairs/lpairs2-$version.tar.gz
      - type: shell
        commands:
          - cp -p /usr/share/automake-*/config.{sub,guess} .
      - type: file
        path: net.sourceforge.lgames.LPairs2.metainfo.xml
      - type: file
        path: net.sourceforge.lgames.LPairs2.desktop

